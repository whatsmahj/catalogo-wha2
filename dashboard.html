<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="meta.dashboardTitle">Panel — Catalogo Wha</title>
<meta name="description" data-i18n="meta.dashboardDesc" content="Gestiona productos, categorías, pedidos y la configuración de tu catálogo.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#581a80">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Catalogo Wha">
<meta property="og:title" data-i18n="meta.dashboardTitle" content="Panel — Catalogo Wha">
<meta property="og:description" data-i18n="meta.dashboardDesc" content="Gestiona productos, categorías, pedidos y la configuración de tu catálogo.">
<meta property="og:image" content="assets/img/og-image.png">
<meta property="og:locale" content="es_ES">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/assets/img/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/styles.css?v=9">
<style>
  /* --- Asistente de configuración (setup) --- */
  .setup-wrap { max-width: 720px; margin: 0 auto; }
  .setup-bar { display: flex; gap: 8px; margin: 16px 0 8px; }
  .setup-bar i { flex: 1; height: 6px; border-radius: 999px; background: var(--line); display: block; transition: background .2s; }
  .setup-bar i.done { background: var(--ok); }
  .setup-bar i.active { background: var(--brand-600); }
  .setup-card { background: #fff; border: 1px solid var(--line); border-radius: 20px;
    padding: 30px; box-shadow: var(--shadow); }
  .setup-ico { width: 52px; height: 52px; border-radius: 14px; background: var(--brand-100);
    display: grid; place-items: center; font-size: 1.5rem; margin-bottom: 14px; }
  .setup-actions { display: flex; gap: 10px; align-items: center; margin-top: 26px; flex-wrap: wrap; }
  .setup-actions .spacer { flex: 1; }
  .setup-logo { width: 74px; height: 74px; border-radius: 18px; background: var(--bg);
    display: grid; place-items: center; overflow: hidden; flex: none; }
  .setup-logo img { width: 100%; height: 100%; object-fit: contain; }
  .setup-logo span { font-size: 1.7rem; font-weight: 750; color: var(--brand); }
  .setup-done-ico { width: 76px; height: 76px; border-radius: 50%; background: var(--ok-bg);
    color: var(--ok); display: grid; place-items: center; font-size: 2.1rem; margin: 0 auto 16px; }

  /* --- Mi cuenta --- */
  .acc-avatar { width: 68px; height: 68px; border-radius: 50%; background: var(--brand-100);
    color: var(--brand); display: grid; place-items: center; font-size: 1.6rem; font-weight: 750; flex: none; }
  .acc-grid { align-items: start; }
  .acc-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0;
    border-top: 1px solid var(--line); font-size: .92rem; }
  .acc-row:first-of-type { border-top: none; }

  /* Prefijo del enlace en el asistente: no debe desbordar en móvil */
  .setup-slug-prefix { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    width: auto; border-radius: 10px 0 0 10px; background: var(--bg); color: var(--ink-3);
    white-space: nowrap; font-size: .82rem; }
  .setup-slug-input { flex: 1 1 40px; min-width: 0; border-radius: 0 10px 10px 0; border-inline-start: 0; }
  @media (max-width: 560px) {
    .setup-card { padding: 22px 18px; }
    .setup-slug-prefix { display: none; }
    .setup-slug-input { border-radius: 10px; border-inline-start: 1px solid var(--line); }
  }
  .acc-danger { border-color: var(--danger) !important; }
  .acc-danger .h3 { color: var(--danger); }
</style>
</head>
<body>

<div class="dash">
  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="/index.html"><span class="logo">CW</span><span>Catalogo&nbsp;<b>Wha</b></span></a>
    <div class="who small muted" style="padding:0 10px 8px">
      <span id="sideBizName">—</span>
      <div class="small muted" id="sideUserEmail" style="font-size:.78rem;word-break:break-all"></div>
    </div>

    <div class="group-label" data-i18n="nav.home">Principal</div>
    <button class="side-link" data-route="home"><span class="ic">🏠</span><span data-i18n="dash.home">Inicio</span></button>
    <button class="side-link" data-route="orders"><span class="ic">🧾</span><span data-i18n="dash.orders">Pedidos</span></button>
    <button class="side-link" data-route="agenda"><span class="ic">📅</span><span data-i18n="agenda.title">Agenda</span></button>
    <button class="side-link" data-route="sales"><span class="ic">📈</span><span data-i18n="sales.title">Ventas</span></button>

    <div class="group-label" data-i18n="nav.catalog">Catálogo</div>
    <button class="side-link" data-route="products"><span class="ic">📦</span><span data-i18n="dash.products">Productos</span></button>
    <button class="side-link" data-route="categories"><span class="ic">🗂️</span><span data-i18n="dash.categories">Categorías</span></button>
    <button class="side-link" data-route="library"><span class="ic">🖼️</span><span data-i18n="dash.library">Biblioteca</span></button>

    <div class="group-label" data-i18n="dash.business">Mi negocio</div>
    <button class="side-link" data-route="config"><span class="ic">⚙️</span><span data-i18n="dash.config">Configurar negocio</span></button>
    <button class="side-link" data-route="setup"><span class="ic">🧭</span><span data-i18n="dash.setup">Asistente de configuración</span></button>

    <div class="group-label" data-i18n="dash.session">Sesión</div>
    <button class="side-link" data-route="account"><span class="ic">👤</span><span data-i18n="dash.account">Mi cuenta</span></button>
    <button class="side-link" id="logoutBtn"><span class="ic">⎋</span><span data-i18n="dash.logout">Cerrar sesión</span></button>

    <div class="group-label hidden" id="adminGroup" data-i18n="adm.group">Administración</div>
    <button class="side-link hidden" id="adminLink" data-route="admin"><span class="ic">★</span><span data-i18n="adm.title">Administración</span></button>
    <button class="side-link hidden" id="adminMetricsLink" data-route="admin-metrics"><span class="ic">📊</span><span data-i18n="adm.metrics">Métricas</span></button>

    <div class="group-label" data-i18n="lang.label">Idioma</div>
    <div class="lang-inline" data-lang-inline style="padding:0 8px"></div>
  </aside>

  <!-- ================= MAIN ================= -->
  <main class="dash-main">
    <div class="dash-top">
      <button class="btn btn-ghost btn-sm" id="sideToggle" style="display:none">☰</button>
      <div class="user-chip">
        <div class="avatar" id="topAvatar">U</div>
        <div class="who small muted">
          <span id="topBizName">—</span>
          <b id="topUserName">—</b>
        </div>
      </div>
      <div class="spacer"></div>
      <div class="lang" data-lang-root></div>
      <a class="btn btn-primary btn-sm" id="viewCatalogBtn" target="_blank" href="#">
        <span data-i18n="dash.viewCatalog">Ver catálogo</span> ↗
      </a>
    </div>

    <div id="view"><div class="empty"><div class="ico">⏳</div><p data-i18n="dash.loading">Cargando…</p></div></div>
  </main>
</div>

<!-- Modal genérico -->
<div class="drawer" id="modal">
  <div class="backdrop" data-close></div>
  <div class="panel" style="inset-inline-start:auto">
    <header>
      <strong id="modalTitle">—</strong>
      <div class="spacer"></div>
      <button class="btn btn-ghost btn-sm" data-close data-i18n="common.close">Cerrar</button>
    </header>
    <div class="content" id="modalBody"></div>
  </div>
</div>

<div class="pwa-banner" id="pwaBanner">
  <div style="flex:1">
    <strong data-i18n="pwa.install">Instalar Catalogo Wha</strong>
    <div class="small" style="opacity:.8" data-i18n="pwa.installText">Instala la app en tu móvil para acceso rápido.</div>
  </div>
  <button class="btn btn-primary btn-sm pwa-install" data-i18n="pwa.installBtn">Instalar</button>
  <button class="btn btn-ghost btn-sm pwa-later" data-i18n="pwa.later">Ahora no</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/config.js?v=9"></script>
<script src="/assets/js/i18n.js?v=9"></script>
<script src="/assets/js/store.js?v=9"></script>
<script src="/assets/js/common.js?v=9"></script>
<script src="/assets/js/dashboard.js?v=9"></script>
</body>
</html>
